version: '3.8'

services:
  # Base de Datos MariaDB reutilizando el contenedor y datos existentes en el VPS
  db:
    image: mariadb:10.6
    restart: always
    command:
      - --slow-query-log=1
      - --long-query-time=1
      - --log-output=TABLE
      - --tmp-table-size=33554432
      - --max-heap-table-size=33554432
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-file-per-table=1
    environment:
      MYSQL_DATABASE: smap_kf
      MYSQL_USER: mrgomez
      MYSQL_PASSWORD: Karin2100
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3309:3306"
    networks:
      - kidsfun-net

  # Redis para cache distribuido (Fase C)
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kidsfun-net

  # Backend API (NestJS + Prisma)
  api:
    image: mrgomezdev/kidsfun-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "mysql://mrgomez:Karin2100@db:3306/smap_kf"
      REDIS_URL: "redis://redis:6379"
      CACHE_ENABLED: "true"
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: "Kidsfun <waiver@kidsfunyfiestasinfantiles.com>"
      CORS_ORIGINS: "https://kidsfunyfiestasinfantiles.com,https://www.kidsfunyfiestasinfantiles.com,http://localhost:3000"
      ADMIN_EMAILS: "mrgomez.dev@outlook.com,kidsfun.developer@gmail.com,karenhenriquez911@gmail.com"
      FIREBASE_CREDENTIALS_PATH: "credentials/smap-kf-firebase-adminsdk-xqq0l-42c4ee6425.json"
      FIREBASE_PROJECT_ID: "smap-kf"
    volumes:
      - media_data:/app/apps/api/media
    depends_on:
      - db
      - redis
    ports:
      - "3001:3001"
    networks:
      - kidsfun-net

  # Frontend Web (Next.js SSR)
  web:
    image: mrgomezdev/kidsfun-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "https://kidsfunyfiestasinfantiles.com"
      INTERNAL_API_URL: "http://api:3001"
    volumes:
      - media_data:/app/apps/web/public/media
    depends_on:
      - api
    ports:
      - "8080:3000" # Conectado al proxy Nginx del puerto 8080
    networks:
      - kidsfun-net

volumes:
  db_data:
    name: proyecto_kidsfun_db_data
  redis_data:
    name: proyecto_kidsfun_redis_data
  media_data:
    name: proyecto_kidsfun_media_data

networks:
  kidsfun-net:
    driver: bridge
