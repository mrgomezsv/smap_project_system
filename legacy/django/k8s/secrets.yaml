apiVersion: v1
kind: Secret
metadata:
  name: kidsfun-django-secret
  namespace: default
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "<definir-fuera-del-repo>"
  DB_PASSWORD: "<definir-fuera-del-repo>"
  EMAIL_HOST_PASSWORD: "<definir-fuera-del-repo>"
  # Aquí se puede agregar el contenido del JSON de Firebase si se prefiere como string
  # o manejarlo como un archivo montado desde otro Secret.
