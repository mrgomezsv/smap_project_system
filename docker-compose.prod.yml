version: '3.8'

services:
  # Base de Datos MariaDB reutilizando el contenedor y datos existentes en el VPS
  db:
    image: mariadb:10.6
    restart: always
    command:
      - --slow-query-log=1
      - --long-query-time=1
      - --log-output=TABLE
      - --tmp-table-size=33554432
      - --max-heap-table-size=33554432
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-file-per-table=1
    environment:
      MYSQL_DATABASE: smap_kf
      MYSQL_USER: mrgomez
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3309:3306" # solo accesible desde el host (túnel SSH)
    networks:
      - kidsfun-net

  # Redis para cache distribuido (Fase C)
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:?Definir REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379" # solo accesible desde el host
    networks:
      - kidsfun-net

  # Backend API (NestJS + Prisma)
  api:
    image: mrgomezdev/kidsfun-api:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "mysql://mrgomez:${DB_PASSWORD}@db:3306/smap_kf"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      CACHE_ENABLED: "true"
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: "Kidsfun <waiver@kidsfunyfiestasinfantiles.com>"
      CORS_ORIGINS: "https://kidsfunyfiestasinfantiles.com,https://www.kidsfunyfiestasinfantiles.com,http://localhost:3000"
      ADMIN_EMAILS: "mrgomez.dev@outlook.com,mrgomez.dev@gmail.com,kidsfun.developer@gmail.com,karenhenriquez911@gmail.com"
      FIREBASE_CREDENTIALS_PATH: "credentials/smap-kf-firebase-adminsdk-xqq0l-42c4ee6425.json"
      FIREBASE_PROJECT_ID: "smap-kf"
      CONTRACT_STORAGE_DIR: "/app/apps/api/private/contracts"
    volumes:
      - media_data:/app/apps/api/media
      - contract_data:/app/apps/api/private/contracts
    depends_on:
      - db
      - redis
    ports:
      - "3001:3001"
    networks:
      - kidsfun-net

  # Frontend Web (Next.js SSR)
  web:
    image: mrgomezdev/kidsfun-web:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "https://kidsfunyfiestasinfantiles.com"
      INTERNAL_API_URL: "http://api:3001"
    volumes:
      - media_data:/app/apps/web/public/media
    depends_on:
      - api
    ports:
      - "8080:3000"
    networks:
      - kidsfun-net

volumes:
  db_data:
    name: proyecto_kidsfun_db_data
  redis_data:
    name: proyecto_kidsfun_redis_data
  media_data:
    name: proyecto_kidsfun_media_data
  contract_data:
    name: proyecto_kidsfun_contract_data

networks:
  kidsfun-net:
    driver: bridge
