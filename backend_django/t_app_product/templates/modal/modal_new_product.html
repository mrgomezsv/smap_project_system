<!-- modal_new_product.html -->
<div class="modal fade" id="newProductModal" tabindex="-1" aria-labelledby="newProductModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 1.25rem; overflow: hidden;">
      <div class="modal-header p-4" style="background-color: var(--primary-color) !important; border: none;">
        <h5 class="modal-title d-flex align-items-center text-white fw-bold" id="newProductModalLabel">
          <i class="bi bi-plus-square me-3 h4 mb-0"></i>
          Registro de Nuevo Producto
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4 bg-light bg-opacity-50">
        <form method="POST" enctype="multipart/form-data" action="{% url 'create_product' %}" class="needs-validation"
          novalidate>
          {% csrf_token %}
          <div class="row g-4">
            <!-- Left Column -->
            <div class="col-lg-7">
              <div class="card border-0 shadow-sm h-100" style="border-radius: 1rem;">
                <div class="card-body p-4">
                  <h6 class="text-primary fw-bold mb-4 border-bottom pb-2">Información Técnica</h6>

                  <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Nombre del Producto</label>
                    <input type="text" class="form-control py-2" name="title" placeholder="Ej: Bounce House Deluxe"
                      required>
                  </div>

                  <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Descripción Detallada</label>
                    <textarea class="form-control" name="description" rows="4"
                      placeholder="Describe las características..."></textarea>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label small fw-bold text-secondary">Categoría</label>
                      <select class="form-select py-2" name="category" required>
                        <option value="">Seleccionar...</option>
                        <option value="option1">Bounce House</option>
                        <option value="option2">Electric Games</option>
                        <option value="option3">Furniture</option>
                        <option value="option4">Concession Machines</option>
                      </select>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label small fw-bold text-secondary">Dimensiones (ft)</label>
                      <input type="text" class="form-control py-2" name="dimensions" placeholder="Ej: 15x15">
                    </div>
                  </div>

                  <div class="form-check form-switch mt-3">
                    <input class="form-check-input" type="checkbox" name="publicated" checked>
                    <label class="form-check-label fw-medium">Activar publicación inmediata</label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-5">
              <div class="card border-0 shadow-sm h-100" style="border-radius: 1rem;">
                <div class="card-body p-4">
                  <h6 class="text-primary fw-bold mb-4 border-bottom pb-2">Multimedia</h6>

                  <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">Imagen de Portada</label>
                    <div class="border rounded-3 p-4 text-center bg-light">
                      <i class="bi bi-cloud-arrow-up h1 text-muted opacity-50 mb-3 d-block"></i>
                      <input class="form-control form-control-sm" type="file" name="img" accept="image/*" required>
                    </div>
                  </div>

                  <div class="mb-0">
                    <label class="form-label small fw-bold text-secondary">Video Promocional (YouTube)</label>
                    <div class="input-group">
                      <span class="input-group-text bg-white border-end-0 text-danger"><i
                          class="bi bi-youtube"></i></span>
                      <input type="url" class="form-control border-start-0" name="youtube_url"
                        placeholder="https://youtube.com/...">
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Buttons -->
          <div class="mt-4 pt-3 d-flex justify-content-end gap-3">
            <button type="button" class="btn py-2 px-4 fw-bold text-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary py-2 px-5 fw-bold">
              Confirmar Registro
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
