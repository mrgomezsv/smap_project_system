<!-- templates/product/partials/card_product.html -->
<div class="col">
    <div class="stat-card p-0 border-0 h-100 overflow-hidden d-flex flex-column">
        <div class="position-relative">
            {% if product.img %}
            <img src="{{ product.img.url }}" class="card-img-top" alt="{{ product.title }}"
                style="height: 180px; object-fit: cover;">
            {% else %}
            <div class="bg-light d-flex align-items-center justify-content-center" style="height: 180px;">
                <i class="bi bi-image text-muted h1 opacity-25"></i>
            </div>
            {% endif %}
            <div class="position-absolute top-0 end-0 p-3">
                <span
                    class="badge {% if product.publicated %}bg-success{% else %}bg-warning text-dark{% endif %} shadow-sm">
                    {% if product.publicated %}Publicado{% else %}Borrador{% endif %}
                </span>
            </div>
        </div>
        <div class="p-4 d-flex flex-column flex-grow-1">
            <h6 class="fw-bold mb-2 text-primary">{{ product.title }}</h6>
            <div class="d-flex justify-content-between align-items-center small text-muted mb-3">
                <span><i class="bi bi-rulers me-1 text-secondary"></i> {{ product.dimensions|default:'- -' }}</span>
                <span class="badge bg-light text-primary border">{{ product.get_category_display }}</span>
            </div>
            <p class="small text-muted mb-4 flex-grow-1"
                style="display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                {{ product.description|default:'Sin descripción' }}
            </p>
            <div class="mt-auto">
                <a href="{% url 'product_detail' product.id %}" class="btn btn-outline-primary w-100 fw-bold py-2"
                    style="border-radius: 0.5rem;">
                    Gestionar Producto
                </a>
            </div>
        </div>
    </div>
</div>
